name: Archive OgasTV published WordPress content
on:
  pull_request:
    paths:
      - 'site/scripts/archive-wordpress-public.mjs'
      - '.github/workflows/archive-wordpress.yml'

permissions:
  contents: write

jobs:
  archive:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Export all public WordPress resources
        working-directory: site
        run: node scripts/archive-wordpress-public.mjs
      - name: Commit immutable audit archive to source branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/wordpress/2026-11-05/
          git diff --cached --quiet && exit 0
          git commit -m 'data(archive): preserve OgasTV WordPress published content snapshot'
          git push origin HEAD:refs/heads/${{ github.head_ref }}
