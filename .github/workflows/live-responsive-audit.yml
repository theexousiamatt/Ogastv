name: OgasTV live desktop and mobile acceptance
on:
  push:
    branches:
      - feat/ogastv-reference-ui-2026-11-05
    paths:
      - '.github/workflows/live-responsive-audit.yml'
      - 'site/scripts/audit-live.mjs'
  workflow_dispatch:
jobs:
  live-browser:
    # Playwright 1.56.1 cannot install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser automation
        run: |
          npm install --no-save --prefix /tmp/ogastv-live playwright@1.56.1
          /tmp/ogastv-live/node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect OgasTV on desktop and mobile
        env:
          PLAYWRIGHT_MODULE: /tmp/ogastv-live/node_modules/playwright/index.mjs
          OGASTV_URL: https://ogastvafrica.ng
        run: node site/scripts/audit-live.mjs
      - name: Upload desktop and mobile screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogastv-live-responsive-audit
          path: live-audit/
          if-no-files-found: warn
          retention-days: 7
