name: OgasTV application checks
on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-checks.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-checks.yml'
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Production build (requires configured database)
        if: env.DATABASE_URL != '' && env.PAYLOAD_SECRET != ''
        env:
          DATABASE_URL: ${{ secrets.OGASTV_DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.OGASTV_PAYLOAD_SECRET }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
