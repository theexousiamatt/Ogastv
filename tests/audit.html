<!doctype html><html lang="en"><head><meta charset="utf-8"><title>OgasTV responsive verification</title><style>body{margin:0;background:#d9dee2}iframe{display:block;border:0;margin:0 auto;background:white}</style></head><body><iframe title="OgasTV responsive editor" allow="microphone"></iframe><pre id="results" hidden>Waiting for audit…</pre><script>
const q=new URLSearchParams(location.search),w=Math.max(320,Math.min(1600,+q.get('w')||390)),h=Math.max(240,Math.min(1200,+q.get('h')||844)),frame=document.querySelector('iframe');frame.style.width=w+'px';frame.style.height=h+'px';
frame.onload=()=>{const script=frame.contentDocument.createElement('script');script.src='/tests/vendor/axe.min.js';script.onload=()=>{let running=false,pending=false,timer;const audit=async()=>{if(running){pending=true;return;}running=true;try{const result=await frame.contentWindow.axe.run(frame.contentDocument.body,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}});document.querySelector('#results').textContent=JSON.stringify({violations:result.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),passes:result.passes.length});}catch(e){document.querySelector('#results').textContent=JSON.stringify({error:e.message});}finally{running=false;if(pending){pending=false;schedule();}}};const schedule=()=>{clearTimeout(timer);timer=setTimeout(audit,700);};frame.contentDocument.addEventListener('click',schedule);frame.contentDocument.addEventListener('input',schedule);frame.contentDocument.addEventListener('change',schedule);frame.contentDocument.addEventListener('keydown',schedule);schedule();};frame.contentDocument.head.append(script);};
frame.src='/dist/?workspace=audit-'+w+'-'+h;
</script></body></html>
